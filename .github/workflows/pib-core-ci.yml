# Light CI for our own patches to Paperclip core (server, ui, cli, packages outside our plugins).
#
# Added 2026-10-11 (Actions-minutes slim, approved by Peet) to replace upstream's ~40-job PR suite (pr.yml), which
# now only runs on PRs into master or with the `full-upstream-ci` label. PiB plugin code is covered by
# pib-plugins-ci.yml. This runs one job: install, typecheck the workspace, and the vitest tests related to the files
# the PR changes (vitest --changed against the base branch).
name: PiB core CI

on:
  pull_request:
    branches: [development]
    paths:
      - 'server/**'
      - 'ui/**'
      - 'cli/**'
      - 'packages/**'
      - '!packages/plugins/**'
      - 'packages/plugins/sdk/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pib-core-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: PiB core CI
    runs-on: [self-hosted, pib-vps]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Root disk before
        run: df -h /

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (same pin as upstream's workflows)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      # Pull requests typecheck only the packages the diff touches and their dependents. The full workspace
      # typecheck runs when the base is unknown (workflow_dispatch) or the diff touches workspace-wide config:
      # root tsconfig*.json, pnpm-workspace.yaml, pnpm-lock.yaml or this workflow. pib-plugin-ui has no
      # typecheck script (--if-present skips it); every other workspace package has one.
      - name: Decide affected-only or full
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mode=full
          if [ "$EVENT" = "pull_request" ]; then
            mode=affected
            if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(tsconfig[^/]*\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml|\.github/workflows/pib-core-ci\.yml)$'; then
              mode=full
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "typecheck scope: ${mode}"

      - name: Typecheck
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASE_REF: ${{ github.base_ref || 'development' }}
        run: |
          # The pib-vps runner has no Rust toolchain (cargo). paperclip-runner's `typecheck` runs
          # `typecheck:rust` (cargo fmt/check) and server's `typecheck` first runs the runner's full `build`
          # (cargo build --release). On this runner both run only their TypeScript halves: the runner's
          # `typecheck:typescript`, and for server `build:typescript` of the runner (emits the d.ts server
          # imports) plus `tsc --noEmit` (PAR-7290). The Rust half stays in release-verify.yml.
          RUNNER='@paperclipai/paperclip-runner'
          SERVER='@paperclipai/server'
          ts_only() {
            pnpm --filter "$RUNNER" typecheck:typescript
            if [ "$1" = server ]; then
              pnpm --filter "$RUNNER" build:typescript
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
              pnpm --filter "$SERVER" exec tsc --noEmit
            fi
          }
          pnpm run preflight:workspace-links
          if [ "$MODE" = "affected" ]; then
            pnpm --filter "...[origin/${BASE_REF}]" --filter "!${RUNNER}" --filter "!${SERVER}" --if-present typecheck
            affected="$(pnpm --filter "...[origin/${BASE_REF}]" list --json --depth -1)"
            if echo "$affected" | jq -e --arg n "$RUNNER" 'any(.[]; .name == $n)' >/dev/null; then
              pnpm --filter "$RUNNER" typecheck:typescript
            fi
            if echo "$affected" | jq -e --arg n "$SERVER" 'any(.[]; .name == $n)' >/dev/null; then
              pnpm --filter "$RUNNER" build:typescript
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
              pnpm --filter "$SERVER" exec tsc --noEmit
            fi
          else
            pnpm -r --filter "!${RUNNER}" --filter "!${SERVER}" typecheck
            ts_only server
          fi

      # Non-blocking until it has been green on a few real core PRs (some upstream server tests need services this
      # light job does not start). Make it blocking by deleting continue-on-error.
      # The job budget is 30 minutes. A large server diff spends most of that on typecheck, and an unbounded
      # vitest --changed then cancels the whole check. Stop this step first so a long non-blocking run cannot
      # erase a green typecheck.
      # In affected mode vitest runs only the root projects whose package is in the affected set.
      - name: Tests related to the changed files
        continue-on-error: true
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASE_REF: ${{ github.base_ref || 'development' }}
        run: |
          projects=()
          if [ "$MODE" = "affected" ]; then
            while IFS= read -r name; do
              [ -n "$name" ] && projects+=(--project "$name")
            done < <(pnpm --filter "...[origin/${BASE_REF}]" list --json --depth -1 | jq -r '.[].name')
          fi
          timeout 12m pnpm exec vitest run --changed "origin/${BASE_REF}" "${projects[@]}" --passWithNoTests || true

      - name: Prune pnpm store
        if: always()
        run: pnpm store prune || true

      - name: Root disk after (must stay under 80%)
        if: always()
        run: |
          df -h /
          use="$(df --output=pcent / | tail -1 | tr -dc 0-9)"
          test "$use" -lt 80 || { echo "root disk at ${use}%"; exit 1; }
