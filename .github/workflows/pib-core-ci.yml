# Light CI for our own patches to Paperclip core (server, ui, cli, packages outside our plugins).
#
# Added 2026-10-11 (Actions-minutes slim, approved by Peet) to replace upstream's ~40-job PR suite (pr.yml), which
# now only runs on PRs into master or with the `full-upstream-ci` label. PiB plugin code is covered by
# pib-plugins-ci.yml. This runs one job: install, typecheck the workspace, and the vitest tests related to the files
# the PR changes (vitest --changed against the base branch).
name: PiB core CI

on:
  pull_request:
    branches: [development]
    paths:
      - 'server/**'
      - 'ui/**'
      - 'cli/**'
      - 'packages/**'
      - '!packages/plugins/**'
      - 'packages/plugins/sdk/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pib-core-ci.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: PiB core CI
    # GitHub-hosted since 2026-11-08 (public repo: free, a clean 4-CPU / 16 GB machine, no queue behind other runs; it
    # used to share the VPS with production).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (same pin as upstream's workflows)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      # Pull requests typecheck only the packages the diff touches and their dependents. The full workspace
      # typecheck runs when the base is unknown (workflow_dispatch) or the diff touches workspace-wide config:
      # root tsconfig*.json, pnpm-workspace.yaml, pnpm-lock.yaml or this workflow. pib-plugin-ui has no
      # typecheck script (--if-present skips it); every other workspace package has one.
      - name: Decide affected-only or full
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mode=full
          if [ "$EVENT" = "pull_request" ]; then
            mode=affected
            if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(tsconfig[^/]*\.json|pnpm-workspace\.yaml|pnpm-lock\.yaml|\.github/workflows/pib-core-ci\.yml)$'; then
              mode=full
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "typecheck scope: ${mode}"

      - name: Typecheck
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASE_REF: ${{ github.base_ref || 'development' }}
        run: |
          # No Rust step here (written for the pib-vps runner, which had no cargo). paperclip-runner's `typecheck` runs
          # `typecheck:rust` (cargo fmt/check) and server's `typecheck` first runs the runner's full `build`
          # (cargo build --release). On this runner both run only their TypeScript halves: the runner's
          # `typecheck:typescript`, and for server `build:typescript` of the runner (emits the d.ts server
          # imports) plus `tsc --noEmit` (PAR-7290). The Rust half stays in release-verify.yml.
          RUNNER='@paperclipai/paperclip-runner'
          SERVER='@paperclipai/server'
          ts_only() {
            pnpm --filter "$RUNNER" typecheck:typescript
            if [ "$1" = server ]; then
              pnpm --filter "$RUNNER" build:typescript
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
              pnpm --filter "$SERVER" exec tsc --noEmit
            fi
          }
          pnpm run preflight:workspace-links
          # cli (and others) typecheck ../server/src, which imports the runner's emitted d.ts: build it first.
          pnpm --filter "$RUNNER" build:typescript
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          if [ "$MODE" = "affected" ]; then
            pnpm --filter "...[origin/${BASE_REF}]" --filter "!${RUNNER}" --filter "!${SERVER}" --if-present typecheck
            affected="$(pnpm --filter "...[origin/${BASE_REF}]" list --json --depth -1)"
            if echo "$affected" | jq -e --arg n "$RUNNER" 'any(.[]; .name == $n)' >/dev/null; then
              pnpm --filter "$RUNNER" typecheck:typescript
            fi
            if echo "$affected" | jq -e --arg n "$SERVER" 'any(.[]; .name == $n)' >/dev/null; then
              pnpm --filter "$RUNNER" build:typescript
              pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
              pnpm --filter "$SERVER" exec tsc --noEmit
            fi
          else
            pnpm -r --filter "!${RUNNER}" --filter "!${SERVER}" typecheck
            ts_only server
          fi

      # Blocking (PAR-12977): the PR's own added or modified test files run first, by name, so they always run and
      # show per-file in the log. The --changed step below can time out on a PR that touches a hub file such as
      # server/src/routes/issues.ts. `vitest list` keeps only files a root vitest project collects (runner, e2e and
      # PiB plugin tests run in their own workflows). A timeout (exit 124) fails the step like a red test.
      - name: Test files changed in this PR
        env:
          BASE_REF: ${{ github.base_ref || 'development' }}
          CI: 'true'
          VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only --diff-filter=AMR "origin/${BASE_REF}...HEAD" | grep -E '\.test\.tsx?$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no changed test files"
            exit 0
          fi
          printf 'changed test file: %s\n' "${changed[@]}"
          list_json="${RUNNER_TEMP}/changed-test-files.json"
          pnpm exec vitest list --filesOnly --json="$list_json" "${changed[@]}" >/dev/null
          mapfile -t files < <(jq -r --arg root "$PWD/" '.[].file | ltrimstr($root)' "$list_json" | sort -u)
          for f in "${changed[@]}"; do
            printf '%s\n' "${files[@]}" | grep -Fxq "$f" || echo "not in a root vitest project, skipped here: $f"
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no changed test files"
            exit 0
          fi
          status=0
          timeout 8m pnpm exec vitest run "${files[@]}" --reporter=default || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Changed test files did not finish within 8 minutes (exit 124)."
          elif [ "$status" -ne 0 ]; then
            echo "::error::Changed test files failed (exit ${status})."
          fi
          exit "$status"

      # Blocking (PAR-12891): a red test fails the job. If a test needs services this light job does not start,
      # exclude that file with --exclude in the vitest call below; never re-add continue-on-error.
      # The job budget is 30 minutes. A large server diff spends most of that on typecheck, and an unbounded
      # vitest --changed then cancels the whole check. Stop this step first so a long run cannot
      # erase a green typecheck.
      # In affected mode vitest runs only the root projects whose package is in the affected set.
      # No `|| true` on the vitest line: a vitest config error (PAR-12762) must fail the step, not read as "no tests".
      - name: Tests related to the changed files
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASE_REF: ${{ github.base_ref || 'development' }}
        run: |
          projects=()
          if [ "$MODE" = "affected" ]; then
            while IFS= read -r name; do
              [ -n "$name" ] && projects+=(--project "$name")
            done < <(pnpm --filter "...[origin/${BASE_REF}]" list --json --depth -1 | jq -r '.[].name')
          fi
          rc=0
          timeout 12m pnpm exec vitest run --changed "origin/${BASE_REF}" "${projects[@]}" --passWithNoTests || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::Changed-file tests hit the 12 minute limit and were stopped. This is a failure, not a pass: run them locally or split the PR."
          fi
          exit "$rc"
