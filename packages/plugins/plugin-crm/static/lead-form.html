<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contact form</title>
<style>
  :root { --accent: #1a73e8; --ink: #1f2933; --muted: #5f6b7a; --line: #cbd2d9; --bad: #b42318; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; padding: 16px; }
  form, #done { max-width: 600px; }
  .row { margin: 0 0 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  input[type="text"], input[type="email"], input[type="tel"], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; color: inherit; background: #fff; }
  input:focus, textarea:focus, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 96px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin: 0 0 8px; }
  .consent input { margin-top: 4px; flex: none; }
  .small { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .small a { color: var(--accent); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: var(--bad); font-size: 13px; margin: 4px 0 0; min-height: 0; }
  .err:empty { display: none; }
  .hp { position: absolute; left: -5000px; width: 1px; height: 1px; overflow: hidden; }
  #done { font-size: 17px; padding: 8px 0; }
</style>
</head>
<body>
<form id="f" novalidate></form>
<div id="done" hidden role="status"></div>
<script src="lead-form.js"></script>
</body>
</html>
