<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{TITLE}} · Paperclip</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f8; --card: #ffffff; --fg: #111113; --muted: #6b6b76; --border: #e4e4e7; --ok: #15803d; --err: #b91c1c; --work: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --card: #151518; --fg: #f4f4f5; --muted: #a1a1aa; --border: #27272a; --ok: #4ade80; --err: #f87171; --work: #60a5fa; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
      .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--work); margin-bottom: 14px; }
      .card[data-tone="ok"] .dot { background: var(--ok); }
      .card[data-tone="error"] .dot { background: var(--err); }
      h1 { font-size: 17px; margin: 0 0 6px; font-weight: 600; }
      p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
      a { display: inline-block; margin-top: 16px; color: var(--fg); font-weight: 500; }
    </style>
  </head>
  <body>
    <main class="card" id="card" data-tone="work">
      <div class="dot" aria-hidden="true"></div>
      <h1 id="title">Finishing sign-in…</h1>
      <p id="detail">One moment.</p>
      <a id="back" href="/" hidden>Back to Paperclip</a>
    </main>
    <noscript><p>JavaScript is required to finish connecting this account.</p></noscript>
    <script src="./oauth-callback.js"></script>
  </body>
</html>
